<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#FFF8E7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#FFF8E7" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="format-detection" content="telephone=no" />
<title>Flag IQ – World Millionaire</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" type="image/png" sizes="32x32"   href="icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  /* =========================
     Light theme color tokens
     ========================= */
  :root {
    --bg-1: #FFF8E7;
    --bg-2: #E8F4F8;
    --bg-3: #F3E9FF;
    --primary: #5B9BD5;
    --primary-dark: #3A7BB5;
    --accent: #F5B041;
    --accent-dark: #D68910;
    --success: #58D68D;
    --success-dark: #239B56;
    --danger: #EC7063;
    --danger-dark: #A93226;
    --text-1: #2C3E50;
    --text-2: #5D6D7E;
    --text-3: #95A5A6;
    --card: #FFFFFF;
    --card-2: #FBFBFB;
    --border: #E5E8EC;
    --shadow-sm: 0 2px 6px rgba(44,62,80,0.08);
    --shadow-md: 0 6px 18px rgba(44,62,80,0.10);
    --shadow-lg: 0 12px 32px rgba(44,62,80,0.14);
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  html { background: var(--bg-1); }   /* extends behind status bar / curved edges so it blends */
  body {
    font-family: 'Segoe UI', 'Helvetica Neue', system-ui, sans-serif;
    color: var(--text-1);
    background:
      radial-gradient(1200px 600px at 10% -10%, var(--bg-3) 0%, transparent 50%),
      radial-gradient(900px 500px at 110% 20%, var(--bg-2) 0%, transparent 50%),
      linear-gradient(180deg, var(--bg-1) 0%, #FFFFFF 100%);
    min-height: 100vh;
    min-height: 100dvh;     /* dynamic viewport — survives Android URL bar collapse */
    overflow-x: hidden;
    overscroll-behavior: contain;   /* no rubber-band on Android Chrome */
    -webkit-text-size-adjust: 100%;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }

  /* ====== App container — portrait-first, capped at phone width ====== */
  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px;
    padding-top: max(12px, env(safe-area-inset-top));
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ====== Header (compact) ====== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    box-shadow: var(--shadow-sm);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand img { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; }
  .brand .title { font-weight: 800; font-size: 15px; line-height: 1; }
  .brand .subtitle { font-size: 10px; color: var(--text-2); letter-spacing: 1px; text-transform: uppercase; }

  .header-pills { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .prize-now {
    background: linear-gradient(135deg, #FFEEC2, #F5B041);
    color: #6E4B11;
    padding: 6px 12px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 13px;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .level-pill {
    background: linear-gradient(135deg, #DCEEF9, #5B9BD5);
    color: #1B3A55;
    padding: 5px 10px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 11px;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  .level-pill:hover { filter: brightness(1.05); }

  /* ====== Main — single column always ====== */
  .main {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }

  .stage {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px;
    box-shadow: var(--shadow-md);
  }

  /* ====== Flag card — tight gaps so it fits on tall portrait phones (e.g. S26 Ultra ~412×880 CSS px) ====== */
  .flag-card { display: flex; flex-direction: column; gap: 8px; }
  .flag-frame {
    width: 100%;
    aspect-ratio: 3/2;
    max-height: 38vh;       /* hard cap so the flag never dominates a tall screen */
    background: var(--bg-2);
    border-radius: var(--radius-md);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 0 0 1px var(--border);
    position: relative;
  }
  .flag-frame img {
    width: 100%; height: 100%;
    /* `contain` shows the WHOLE flag accurately even for non-3:2 flags
       (Switzerland 1:1, Qatar 11:28, Nepal pennant). The bg-2 tint
       provides clean letterboxing. */
    object-fit: contain;
    transition: opacity .25s ease;
  }
  .flag-frame .loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 13px;
  }

  .facts {
    background: linear-gradient(135deg, #FFFDF5, #FFF8E7);
    border: 1px dashed #F5C77E;
    border-radius: var(--radius-md);
    padding: 8px 12px;
    color: #6E4B11;
    font-size: 13px;
    line-height: 1.4;
  }
  .facts h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-dark);
    margin-bottom: 4px;
  }
  .facts ul { padding-left: 18px; }
  .facts li { margin-bottom: 2px; }

  .question-prompt {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 600;
    margin-top: 2px;
  }

  /* ====== Options — always full width on portrait ====== */
  .options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 2px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--card-2);
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    text-align: left;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-1);
    transition: transform .12s ease, background .2s ease, border-color .2s ease;
    width: 100%;
    /* Min-height keeps tap target ≥ 48dp Material guideline */
    min-height: 48px;
  }
  .option:hover:not(:disabled) {
    background: #EAF3FB;
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .option:active:not(:disabled) { transform: scale(0.98); }
  .option .letter {
    width: 28px; height: 28px;
    flex: 0 0 28px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-weight: 800;
    font-size: 12px;
  }
  .option.correct { background: #E8F8EE; border-color: var(--success); }
  .option.correct .letter { background: var(--success-dark); }
  .option.wrong   { background: #FDECEA; border-color: var(--danger); }
  .option.wrong .letter { background: var(--danger-dark); }
  .option.eliminated { opacity: 0.35; pointer-events: none; }
  .option.hint { box-shadow: 0 0 0 3px rgba(245,176,65,.45); }

  /* ====== Lifelines section (now inside the stage) ====== */
  .section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-2); font-weight: 700;
    margin: 4px 0 4px;
  }

  .lifelines { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .lifeline {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 4px;
    background: linear-gradient(135deg, #F3E9FF, #DCEEF9);
    border: 2px solid #C7DAEC;
    border-radius: var(--radius-md);
    color: var(--primary-dark);
    font-size: 10px; font-weight: 700;
    text-align: center;
    transition: transform .12s ease, opacity .2s ease;
    line-height: 1.2;
    min-height: 56px;   /* keep tap target comfortable */
  }
  .lifeline .icon { font-size: 20px; }
  .lifeline:active:not(:disabled) { transform: scale(0.96); }
  .lifeline:disabled { opacity: 0.35; cursor: not-allowed; filter: grayscale(0.6); }

  /* ====== Rung styles (used by ladder modal) ====== */
  .rung {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px; font-weight: 600;
    color: var(--text-2);
    margin-bottom: 2px;
  }
  .rung.safety { color: var(--accent-dark); font-weight: 800; }
  .rung.current {
    background: linear-gradient(135deg, #FFEEC2, #F5B041);
    color: #6E4B11;
    box-shadow: var(--shadow-sm);
  }
  .rung.passed { color: var(--success-dark); }
  .rung .lvl { opacity: 0.6; }

  .ladder-modal-body {
    max-height: 60vh;
    overflow-y: auto;
    text-align: left;
    padding: 4px;
    background: var(--card-2);
    border-radius: var(--radius-md);
    margin-top: 6px;
  }
  .ladder-modal-body::-webkit-scrollbar { width: 6px; }
  .ladder-modal-body::-webkit-scrollbar-thumb { background: #D6DBDF; border-radius: 6px; }

  /* ====== Action row (3 columns: Ladder / Walk Away / Restart) ====== */
  .actions-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  .actions-row .btn {
    padding: 11px 6px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    min-height: 44px;
  }

  .btn {
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    transition: transform .12s ease, opacity .2s ease;
  }
  .btn-primary   { background: linear-gradient(135deg, #7FB8DD, #3A7BB5); color: white; box-shadow: var(--shadow-sm); }
  .btn-secondary { background: #F4F6F8; color: var(--text-1); border: 1px solid var(--border); }
  .btn-walk      { background: linear-gradient(135deg, #FFEEC2, #F5B041); color: #6E4B11; }
  .btn:hover:not(:disabled)  { transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ====== Modal ====== */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(44,62,80,0.45);
    display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px;
    max-width: 460px; width: 100%;
    box-shadow: var(--shadow-lg);
    text-align: center;
  }
  .modal h2 { margin-bottom: 8px; font-size: 22px; }
  .modal p  { color: var(--text-2); margin-bottom: 16px; line-height: 1.5; }
  .modal .icon-big { font-size: 56px; margin-bottom: 8px; }
  .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Hint chip */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: #F3E9FF;
    color: #6C3483;
    border-radius: 999px;
    font-weight: 700; font-size: 12px;
    margin-bottom: 8px;
  }

  /* ====== Start screen ====== */
  .splash {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 36px 28px;
    box-shadow: var(--shadow-md);
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .splash img { width: 120px; height: 120px; }
  .splash h1 { font-size: 36px; line-height: 1.1; margin: 4px 0 0; }
  .splash p { color: var(--text-2); max-width: 460px; }

  .splash-subtitle {
    color: var(--primary-dark);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .splash-tagline {
    color: var(--text-2);
    font-size: 15px;
    margin-bottom: 4px;
  }

  .splash-buttons {
    display: flex; flex-direction: column; gap: 10px;
    width: 100%; max-width: 320px;
    margin-top: 14px;
  }
  .splash-buttons .btn { width: 100%; }
  .btn-large {
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 800;
  }

  .feature-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 8px 0; }
  .feature {
    background: linear-gradient(135deg, #DCEEF9, #F3E9FF);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 6px 12px;
    font-size: 12px; font-weight: 700;
    color: var(--primary-dark);
  }
  .hidden { display: none !important; }

  /* Make modals scrollable + a wider variant for About */
  .modal {
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal.large { max-width: 600px; }
  .modal h4 {
    margin: 14px 0 6px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent-dark);
  }
  .modal .body-block {
    text-align: left; font-size: 14px; line-height: 1.6;
  }
  .modal .body-block ul, .modal .body-block ol { padding-left: 20px; margin: 4px 0; }
  .modal .body-block li { margin-bottom: 4px; }

  /* High scores list inside modal */
  .hs-modal-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .hs-modal-list li {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 10px;
    font-size: 13px;
    border-radius: 8px;
    color: var(--text-1);
    text-align: left;
  }
  .hs-modal-list li:nth-child(odd) { background: rgba(245,176,65,0.10); }
  .hs-modal-list li.rank-1 { background: linear-gradient(135deg, #FFEEC2, #F5B041); color: #6E4B11; }
  .hs-modal-list li.rank-2 { background: linear-gradient(135deg, #ECEFF1, #CFD8DC); }
  .hs-modal-list li.rank-3 { background: linear-gradient(135deg, #FFE0B2, #FFB74D); }
  .hs-modal-list li .rank { font-weight: 800; }
  .hs-modal-list li .name { font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hs-modal-list li .name small { font-weight: 600; color: var(--text-3); margin-left: 4px; }
  .hs-modal-list li .score { font-weight: 800; color: var(--success-dark); white-space:nowrap; }
  .hs-modal-list li.rank-1 .score { color: #6E4B11; }

  /* tiny shake */
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
  }
  .shake { animation: shake .35s ease; }

  /* ====== Name input ====== */
  .name-input-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 100%; max-width: 380px;
    margin: 6px 0 4px;
  }
  .name-input-wrap label {
    font-size: 13px; color: var(--text-2); font-weight: 700;
  }
  .name-input-wrap input {
    width: 100%; padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 16px; font-family: inherit;
    text-align: center; font-weight: 600;
    background: var(--card-2);
    color: var(--text-1);
    transition: border-color .2s ease, background .2s ease;
  }
  .name-input-wrap input:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
  }
  .name-input-wrap input.invalid {
    border-color: var(--danger);
    background: #FDECEA;
    animation: shake .35s ease;
  }

  /* ====== High scores panel ====== */
  .hi-scores {
    background: linear-gradient(135deg, #FFFDF5, #FFF8E7);
    border: 1px dashed #F5C77E;
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-top: 8px;
    width: 100%;
    max-width: 520px;
  }
  .hi-scores h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-dark);
    margin-bottom: 8px;
    text-align: center;
  }
  .hi-scores ol {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .hi-scores li {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 7px 10px;
    font-size: 13px;
    border-radius: 8px;
    color: var(--text-1);
  }
  .hi-scores li:nth-child(odd) { background: rgba(245,176,65,0.10); }
  .hi-scores li.rank-1 { background: linear-gradient(135deg, #FFEEC2, #F5B041); color: #6E4B11; }
  .hi-scores li.rank-2 { background: linear-gradient(135deg, #ECEFF1, #CFD8DC); }
  .hi-scores li.rank-3 { background: linear-gradient(135deg, #FFE0B2, #FFB74D); }
  .hi-scores li .rank { font-weight: 800; }
  .hi-scores li .name { font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hi-scores li .name small { font-weight: 600; color: var(--text-3); margin-left: 4px; }
  .hi-scores li .score { font-weight: 800; color: var(--success-dark); white-space:nowrap; }
  .hi-scores li.rank-1 .score { color: #6E4B11; }
  .hi-scores li.empty {
    grid-template-columns: 1fr;
    text-align: center;
    color: var(--text-3); font-style: italic; font-weight: 500;
  }
  .hi-scores .reset-row { display:flex; justify-content:center; margin-top: 8px; }
  .hi-scores .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .hi-scores .reset-btn:hover { background: var(--card-2); }
</style>
</head>
<body>

<div class="app">

  <!-- ====== Header (compact, portrait-friendly) ====== -->
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="Flag IQ icon"/>
      <div>
        <div class="title">Flag IQ</div>
        <div class="subtitle">World Millionaire</div>
      </div>
    </div>
    <div class="header-pills">
      <button id="levelPill" class="level-pill hidden" type="button" title="Buka tangga hadiah">Level 1</button>
      <span id="prizeNow" class="prize-now hidden">Rp 0</span>
    </div>
  </header>

  <!-- ====== Splash / Main menu ====== -->
  <section id="splash" class="splash">
    <img src="icon.svg" alt="Flag IQ"/>
    <h1>Flag IQ</h1>
    <div class="splash-subtitle">World Millionaire</div>
    <p class="splash-tagline">Tebak <b id="splashCount">…</b> bendera dari seluruh dunia 🌍</p>

    <div class="splash-buttons">
      <button id="startBtn"   class="btn btn-primary btn-large">▶ Mulai Bermain</button>
      <button id="scoresBtn"  class="btn btn-secondary">🏆 High Scores</button>
      <button id="aboutBtn"   class="btn btn-secondary">ℹ️ About</button>
    </div>
  </section>

  <!-- ====== Name entry — shown after Mulai Bermain is clicked ====== -->
  <section id="nameEntry" class="splash hidden">
    <img src="icon.svg" alt="Flag IQ"/>
    <h1>Siapa Namamu?</h1>
    <p class="splash-tagline">Skor kamu akan tercatat di leaderboard 🏆</p>

    <div class="name-input-wrap">
      <input id="playerNameInput" type="text" placeholder="Contoh: Febe" maxlength="20" autocomplete="off" />
    </div>

    <div class="splash-buttons">
      <button id="confirmNameBtn" class="btn btn-primary btn-large">▶ Mulai</button>
      <button id="backToMenuBtn"  class="btn btn-secondary">← Kembali</button>
    </div>
  </section>

  <!-- ====== Main game area (single column, portrait-first) ====== -->
  <section id="game" class="main hidden">
    <div class="stage">
      <div class="flag-card">
        <div class="flag-frame">
          <img id="flagImg" alt="Flag" />
          <div id="flagLoading" class="loading">Loading flag…</div>
        </div>

        <div class="facts">
          <h4>Fun Facts</h4>
          <ul id="factsList"></ul>
        </div>

        <div id="extraClue"  class="chip hidden">💡 Extra clue: <span id="extraClueText"></span></div>
        <div id="parentHint" class="chip hidden" style="background:#FFE9D6; color:#A93226;">👨‍👩‍👧 <span id="parentHintText"></span></div>

        <div class="question-prompt">🌐 Negara apa ini?</div>
        <div id="options" class="options"></div>

        <div class="section-label">Bantuan</div>
        <div class="lifelines">
          <button id="ll5050"   class="lifeline" type="button" title="50:50 — hapus 2 jawaban salah">
            <div class="icon">5️⃣0️⃣</div><div>50 : 50</div>
          </button>
          <button id="llClue"   class="lifeline" type="button" title="Beri petunjuk tambahan">

/* ============================================================
   High score persistence (localStorage)
   ============================================================ */
const HS_KEY = 'flagIqHighScores';
const HS_LIMIT = 10;

function getHighScores() {
  try {
    const raw = localStorage.getItem(HS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveHighScore(name, score, outcome) {
  const scores = getHighScores();
  scores.push({
    name: (name || 'Anonim').slice(0, 20),
    score: Math.max(0, Math.round(score || 0)),
    outcome,                          // 'win' | 'fail' | 'walkaway'
    date: new Date().toISOString().slice(0, 10),
  });
  scores.sort((a, b) => b.score - a.score || a.date.localeCompare(b.date));
  const trimmed = scores.slice(0, HS_LIMIT);
  try { localStorage.setItem(HS_KEY, JSON.stringify(trimmed)); } catch (e) {}
  return trimmed;
}

function clearHighScores() {
  try { localStorage.removeItem(HS_KEY); } catch (e) {}
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function outcomeIcon(o){
  if (o === 'win')      return '👑';
  if (o === 'walkaway') return '💼';
  return '🎯';  // fail
}

/* High scores rendered as a compact HTML snippet for end-of-game modals */
function topScoresHtml(limit){
  const scores = getHighScores().slice(0, limit || 5);
  if (scores.length === 0) return '<i style="color:#95A5A6">Belum ada skor tercatat.</i>';
  return scores.map((s, i) =>
    `<div style="display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:2px 0;">
       <span><b>${i+1}.</b> ${escapeHtml(s.name)} ${outcomeIcon(s.outcome)}</span>
       <span style="font-weight:700; color:#239B56;">${fmtIDR(s.score)}</span>
     </div>`
  ).join('');
}

/* ============================================================
   Prize ladder generation
   Strictly monotonic increase from `min` to `max`. NEVER exceeds
   `max` at any rung except the final one. Uses 5 magnitude
   checkpoints with linear interpolation, then rounds each rung
   to a nice IDR step. Scales to any COUNTRIES.length.
   ============================================================ */
function makeLadder(n, min, max){
  if (n < 2) return [min];

  // Anchor checkpoints define the shape of the curve:
  // gentle rise → mid acceleration → big finish.
  const checkpoints = [
    [0,                  min     ],
    [Math.round(n*0.20),  5000   ],
    [Math.round(n*0.40),  25000  ],
    [Math.round(n*0.60),  100000 ],
    [Math.round(n*0.80),  400000 ],
    [n - 1,               max    ],
  ];

  // Linear interpolation between checkpoints
  const ladder = new Array(n);
  for (let c = 0; c < checkpoints.length - 1; c++) {
    const [i1, v1] = checkpoints[c];
    const [i2, v2] = checkpoints[c+1];
    const span = Math.max(1, i2 - i1);
    for (let i = i1; i <= i2; i++) {
      const t = (i - i1) / span;
      ladder[i] = v1 + t * (v2 - v1);
    }
  }

  // Pick a nice rounding step based on prize magnitude.
  // Step is chosen so that step <= natural increment, so consecutive
  // rounded rungs almost always end up distinct.
  function niceStep(v) {
    if (v < 2500)        return 50;
    if (v < 10000)       return 100;
    if (v < 50000)       return 500;
    if (v < 200000)      return 1000;
    if (v < 500000)      return 5000;
    return 10000;
  }

  // Round each rung to a nice IDR figure
  for (let i = 0; i < n; i++) {
    const step = niceStep(ladder[i]);
    ladder[i] = Math.round(ladder[i] / step) * step;
  }

  // Final pass: enforce strict monotonic increase AND cap below `max`
  // for every rung except the last. This is what guarantees the
  // prize never exceeds Rp 1,000,000 in the middle of the ladder.
  for (let i = 1; i < n - 1; i++) {
    // Hard cap: nothing in the middle is allowed to reach max
    const ceiling = max - niceStep(max - 1); // e.g. 1,000,000 - 10,000 = 990,000
    if (ladder[i] >= ceiling) ladder[i] = ceiling;

    // Bump up if duplicate / decreasing
    if (ladder[i] <= ladder[i-1]) {
      const step = niceStep(ladder[i-1]);
      ladder[i] = Math.min(ladder[i-1] + step, ceiling);
    }
  }

  // Anchor first and last rung explicitly
  ladder[0]    = min;
  ladder[n-1]  = max;
  return ladder;
}

/* ============================================================
   Game state
   ============================================================ */
const state = {
  playerName: '',
  order: [],
  level: 0,
  prizes: [],
  safetyLevels: [],
  lifelines: { fifty: true, clue: true, parent: true },
  lockedPrize: 0,
  answered: false,
};

const $ = (id) => document.getElementById(id);

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmtIDR(n){ return 'Rp ' + n.toLocaleString('id-ID'); }

/* ============================================================
   Question + options builder
   ============================================================ */
function buildQuestion(level){
  const country = COUNTRIES[ state.order[level] ];
  const sameRegion = COUNTRIES.filter(c => c.region === country.region && c.code !== country.code);
  const others = COUNTRIES.filter(c => c.code !== country.code);
  const pool = sameRegion.length >= 6 ? sameRegion : others;
  const distractors = shuffle([...pool]).slice(0,3);

  const opts = shuffle([country, ...distractors]);
  const correctIndex = opts.findIndex(o => o.code === country.code);

  return { country, options: opts, correctIndex };
}

/* ============================================================
   Render functions
   ============================================================ */
// Build the prize-ladder HTML (used by the ladder modal).
// Newer/higher levels at the top; current level is highlighted.
function buildLadderHtml(){
  return state.prizes.map((p, i) => {
    let cls = 'rung';
    if (i === state.level) cls += ' current';
    else if (i < state.level) cls += ' passed';
    if (state.safetyLevels.includes(i)) cls += ' safety';
    const lock = state.safetyLevels.includes(i) ? ' 🔒' : '';
    return `<div class="${cls}"><span class="lvl">${i+1}.</span><span>${fmtIDR(p)}${lock}</span></div>`;
  }).reverse().join('');
}

function showLadderModal(){
  const html = buildLadderHtml();
  showModal({
    icon:'📊',
    title:`Tangga Hadiah — Level ${state.level + 1} / ${state.prizes.length}`,
    body:`<div class="ladder-modal-body" id="ladderModalBody">${html}</div>`,
    primary:'Tutup', onPrimary: closeModal
  });
  // Center the current rung in the scrollable view
  setTimeout(() => {
    const cur = document.querySelector('#ladderModalBody .rung.current');
    if (cur) cur.scrollIntoView({ block:'center' });
  }, 50);
}

function renderHeader(){
  $('levelPill').textContent = `Level ${state.level+1} / ${state.prizes.length}`;
  $('prizeNow').textContent  = `${fmtIDR(state.prizes[state.level])}`;
  $('levelPill').classList.remove('hidden');
  $('prizeNow').classList.remove('hidden');
}

function renderQuestion(q){
  state.answered = false;

  const img = $('flagImg');
  const loading = $('flagLoading');
  loading.style.display = 'flex';
  loading.textContent = 'Loading flag…';
  img.style.opacity = 0;
  img.onload  = () => { loading.style.display = 'none'; img.style.opacity = 1; };
  img.onerror = () => { loading.textContent = '⚠️ Could not load flag'; };
  img.src = `https://flagcdn.com/w640/${q.country.code}.png`;
  img.alt = `Flag of ${q.country.name}`;

  const ul = $('factsList'); ul.innerHTML = '';
  q.country.facts.forEach(f => { const li=document.createElement('li'); li.textContent=f; ul.appendChild(li); });

  $('extraClue').classList.add('hidden');
  $('parentHint').classList.add('hidden');

  const wrap = $('options'); wrap.innerHTML = '';
  const letters = ['A','B','C','D'];
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.dataset.index = idx;
    btn.innerHTML = `<span class="letter">${letters[idx]}</span><span>${opt.name}</span>`;
    btn.addEventListener('click', () => onAnswer(idx));
    wrap.appendChild(btn);
  });

  $('ll5050').disabled   = !state.lifelines.fifty;
  $('llClue').disabled   = !state.lifelines.clue;
  $('llParent').disabled = !state.lifelines.parent;

  renderHeader();
}

/* ============================================================
   Answering
   ============================================================ */
let currentQ = null;

function onAnswer(idx){
  if (state.answered) return;
  state.answered = true;

  const buttons = document.querySelectorAll('.option');
  buttons.forEach(b => b.disabled = true);

  const correct = currentQ.correctIndex;
  buttons[correct].classList.add('correct');

  if (idx === correct) {
    setTimeout(() => onCorrect(), 900);
  } else {
    buttons[idx].classList.add('wrong','shake');
    setTimeout(() => onWrong(), 1500);
  }
}

function onCorrect(){
  const wonNow = state.prizes[state.level];
  if (state.safetyLevels.includes(state.level)) state.lockedPrize = wonNow;

  state.level++;
  if (state.level >= state.prizes.length) {
    // Won the whole game — record top prize as the high score
    saveHighScore(state.playerName, wonNow, 'win');
    return showModal({
      icon:'🏆', title:'JACKPOT!',
      body:
        `Selamat <b>${escapeHtml(state.playerName)}</b>! Kamu memenangkan <b>${fmtIDR(wonNow)}</b> dengan menebak SEMUA ${state.prizes.length} bendera dunia dengan benar!`
        + `<br/><br/><b>🏆 Top 5 High Scores:</b><br/>${topScoresHtml(5)}`,
      primary:'Main Lagi', onPrimary: resetGame
    });
  }
  currentQ = buildQuestion(state.level);
  renderQuestion(currentQ);
}

function onWrong(){
  // High-score value = prize at the level where they FAILED
  // (not the safety line they cashed out at).
  const failedLevelPrize = state.prizes[state.level];
  saveHighScore(state.playerName, failedLevelPrize, 'fail');

  // Show which safety line (if any) the player crossed.
  const passedAny = state.lockedPrize > 0;
  let safetyMsg;
  if (passedAny) {
    const passedSafetyIdx = state.safetyLevels.filter(idx => idx < state.level).pop();
    const safetyLevelNum = passedSafetyIdx + 1; // 1-based for display
    safetyMsg = `Untungnya kamu sudah lolos <b>safety line di Level ${safetyLevelNum}</b>, jadi kamu pulang dengan <b>${fmtIDR(state.lockedPrize)}</b>. 🔒`;
  } else {
    safetyMsg = `Sayangnya kamu belum lolos safety line pertama (Level 20), jadi kamu pulang dengan <b>Rp 0</b>. 😢`;
  }
  const scoreMsg = `📊 Skor tercatat untuk <b>${escapeHtml(state.playerName)}</b>: <b>${fmtIDR(failedLevelPrize)}</b> (Level ${state.level + 1}).`;

  showModal({
    icon: passedAny ? '💔' : '😢',
    title: 'Jawaban Salah',
    body:
      `Jawaban yang benar adalah <b>${currentQ.country.name}</b>.<br/><br/>`
      + `${safetyMsg}<br/><br/>${scoreMsg}`
      + `<br/><br/><b>🏆 Top 5:</b><br/>${topScoresHtml(5)}`,
    primary:'Main Lagi', onPrimary: resetGame
  });
}

/* ============================================================
   Lifelines
   ============================================================ */
function useFifty(){
  if (!state.lifelines.fifty) return;
  state.lifelines.fifty = false;
  $('ll5050').disabled = true;

  const wrongs = currentQ.options
    .map((o,i) => ({i, isCorrect: i === currentQ.correctIndex}))
    .filter(o => !o.isCorrect)
    .map(o => o.i);
  shuffle(wrongs).slice(0,2).forEach(i => {
    document.querySelectorAll('.option')[i].classList.add('eliminated');
  });
}

function useClue(){
  if (!state.lifelines.clue) return;
  state.lifelines.clue = false;
  $('llClue').disabled = true;
  const clueText = currentQ.country.clues.join(' • ');
  $('extraClueText').textContent = clueText;
  $('extraClue').classList.remove('hidden');
}

function useParent(){
  if (!state.lifelines.parent) return;
  state.lifelines.parent = false;
  $('llParent').disabled = true;

  const letters = ['A','B','C','D'];
  const lucky = Math.random() < 0.75;
  let pickIdx, msg;
  if (lucky) {
    pickIdx = currentQ.correctIndex;
    const persona = Math.random() < 0.5 ? 'Mama' : 'Papa';
    msg = `${persona} bilang: "Sepertinya jawabannya ${letters[pickIdx]} — ${currentQ.options[pickIdx].name}."`;
  } else {
    const wrongOpts = currentQ.options.map((_,i)=>i).filter(i => i !== currentQ.correctIndex);
    pickIdx = wrongOpts[Math.floor(Math.random()*wrongOpts.length)];
    const persona = Math.random() < 0.5 ? 'Mama' : 'Papa';
    msg = `${persona} agak ragu, tapi mungkin ${letters[pickIdx]} — ${currentQ.options[pickIdx].name}? 🤔`;
  }

  document.querySelectorAll('.option')[pickIdx].classList.add('hint');
  $('parentHintText').textContent = msg;
  $('parentHint').classList.remove('hidden');
}

/* ============================================================
   Walk away
   ============================================================ */
function walkAway(){
  const have = state.level === 0 ? 0 : state.prizes[state.level - 1];
  showModal({
    icon:'💼', title:'Walk Away?',
    body:`Yakin mau berhenti sekarang dan membawa pulang <b>${fmtIDR(have)}</b>?`,
    primary:'Ya, Berhenti', onPrimary: () => {
      saveHighScore(state.playerName, have, 'walkaway');
      showModal({
        icon:'🎉', title:'Selamat!',
        body:
          `Kamu pulang membawa <b>${fmtIDR(have)}</b>. Kerja bagus, <b>${escapeHtml(state.playerName)}</b>!`
          + `<br/><br/><b>🏆 Top 5:</b><br/>${topScoresHtml(5)}`,
        primary:'Main Lagi', onPrimary: resetGame
      });
    },
    secondary:'Lanjut Main', onSecondary: closeModal
  });
}

/* ============================================================
   Modal
   ============================================================ */
function showModal({icon,title,body,primary,onPrimary,secondary,onSecondary,large}){
  $('modalIcon').textContent = icon || '🎉';
  $('modalTitle').textContent = title || '';
  $('modalBody').innerHTML = body || '';
  const p = $('modalPrimary'), s = $('modalSecondary');
  p.textContent = primary || 'OK';
  p.onclick = () => { closeModal(); if (onPrimary) onPrimary(); };
  if (secondary) {
    s.textContent = secondary;
    s.classList.remove('hidden');
    s.onclick = () => { closeModal(); if (onSecondary) onSecondary(); };
  } else {
    s.classList.add('hidden');
  }
  // Toggle wider modal style for content-heavy screens (e.g. About)
  const modalEl = document.querySelector('#modalBg .modal');
  if (modalEl) modalEl.classList.toggle('large', !!large);
  $('modalBg').classList.add('show');
}
function closeModal(){ $('modalBg').classList.remove('show'); }

      return `<li class="${rankClass}">
        <span class="rank">${i+1}.</span>
        <span class="name">${escapeHtml(s.name)} <small>${outcomeIcon(s.outcome)} ${s.date}</small></span>

    }).join('') + '</ol>';

  }
  showModal({

/* ============================================================
   Game flow
   ============================================================ */
// Splash menu → Name entry screen
function openNameEntry(){
  $('splash').classList.add('hidden');
  $('nameEntry').classList.remove('hidden');
  const nameInput = $('playerNameInput');
  if (nameInput) {
    if (state.playerName) nameInput.value = state.playerName;
    setTimeout(() => nameInput.focus(), 50);
  }
}

// Name entry screen → Splash menu
function backToMenu(){
  $('nameEntry').classList.add('hidden');
  $('splash').classList.remove('hidden');
}

// Name entry screen → Game (validates name first)
function beginGame(){
  const nameInput = $('playerNameInput');
  const name = (nameInput && nameInput.value || '').trim();
  if (!name) {
    if (nameInput) {
      nameInput.classList.add('invalid');
      nameInput.focus();
      setTimeout(() => nameInput.classList.remove('invalid'), 1200);
    }
    return;
  }
  state.playerName = name;

  $('splash').classList.add('hidden');
  $('nameEntry').classList.add('hidden');
  $('game').classList.remove('hidden');

  // Tier sizes match the dataset structure (25 + 50 + the rest)
  const T1 = 25, T2 = 50;
  const tier1 = [...Array(T1).keys()];                          // 0..24
  const tier2 = [...Array(T2).keys()].map(i => i + T1);         // 25..74
  const tier3 = [...Array(COUNTRIES.length - T1 - T2).keys()].map(i => i + T1 + T2); // 75..end
  state.order = [ ...shuffle(tier1), ...shuffle(tier2), ...shuffle(tier3) ];

  state.level = 0;
  state.prizes = makeLadder(state.order.length, 1000, 1000000);

  // Safety lines every 20 levels (Level 20, 40, 60, 80, 100, 120, 140, 160, 180).
  // When the player correctly answers a safety question, that prize is locked in:
  // even if they later guess wrong, they go home with at least that amount.
  // If they guess wrong before reaching the FIRST safety (Level 20), they go home with Rp 0.
  const n = state.prizes.length;
  state.safetyLevels = [];
  for (let lvl = 20; lvl < n; lvl += 20) {
    state.safetyLevels.push(lvl - 1); // convert 1-based level to 0-based index
  }
  state.lockedPrize = 0;

  state.lifelines = { fifty: true, clue: true, parent: true };
  currentQ = buildQuestion(0);
  renderQuestion(currentQ);
}

function resetGame(){
  $('game').classList.add('hidden');
  $('nameEntry').classList.add('hidden');
  $('splash').classList.remove('hidden');
  $('levelPill').classList.add('hidden');
  $('prizeNow').classList.add('hidden');
  // playerName is kept in state — we'll pre-fill it next time the user opens nameEntry.
}

/* ============================================================
   Wire up
   ============================================================ */
// Register the service worker for offline play (PWA install).
// Runs only on http(s) origins — quietly skipped when opening file:// directly.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err =>
      console.warn('Service worker registration failed:', err)
    );
  });
}

window.addEventListener('DOMContentLoaded', () => {
  $('splashCount').textContent = COUNTRIES.length;

  // ----- Splash menu buttons -----
  $('startBtn').onclick   = openNameEntry;
  $('scoresBtn').onclick  = showHighScoresModal;
  $('aboutBtn').onclick   = showAbout;

  // ----- Name entry buttons -----
  $('confirmNameBtn').onclick = beginGame;
  $('backToMenuBtn').onclick  = backToMenu;

  // Pressing Enter in the name field begins the game
  const nameInput = $('playerNameInput');
  if (nameInput) {
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); beginGame(); }
    });
  }

  // ----- In-game buttons -----
  $('ll5050').onclick   = useFifty;
  $('llClue').onclick   = useClue;
  $('llParent').onclick = useParent;
  $('walkBtn').onclick  = walkAway;
  $('ladderBtn').onclick = showLadderModal;
  // Tapping the Level pill in the header also opens the ladder
  $('levelPill').onclick = showLadderModal;
  $('quitBtn').onclick  = () => {
    showModal({
      icon:'⟲', title:'Restart Game?',
      body:'Yakin mau memulai ulang dari Level 1? Hadiah saat ini akan hilang.',
      primary:'Ya, Restart', onPrimary: resetGame,
      secondary:'Batal', onSecondary: closeModal
    });
  };
});
