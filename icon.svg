<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8D5F2"/>
      <stop offset="100%" stop-color="#5B9BD5"/>
    </linearGradient>
    <radialGradient id="globe" cx="35%" cy="35%">
      <stop offset="0%" stop-color="#C9E4F5"/>
      <stop offset="55%" stop-color="#7FB8DD"/>
      <stop offset="100%" stop-color="#3A7BB5"/>
    </radialGradient>
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#D68910"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background (Android-style adaptive icon canvas) -->
  <rect width="512" height="512" rx="110" fill="url(#bgSky)"/>

  <!-- Subtle confetti dots -->
  <circle cx="80"  cy="90"  r="6" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="430" cy="80"  r="8" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="60"  cy="430" r="7" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="450" cy="440" r="6" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="120" cy="200" r="4" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="400" cy="220" r="4" fill="#FFFFFF" opacity="0.4"/>

  <!-- Globe -->
  <g filter="url(#softShadow)">
    <circle cx="256" cy="280" r="148" fill="url(#globe)"/>

    <!-- Continents (stylized) -->
    <path d="M178 232 Q205 220, 232 235 Q258 250, 250 275 Q240 295, 215 295 Q190 290, 178 270 Z"
          fill="#8FCB8A"/>
    <path d="M270 220 Q300 210, 325 230 Q345 248, 340 275 Q330 295, 305 290 Q282 280, 270 250 Z"
          fill="#8FCB8A"/>
    <path d="M170 320 Q190 330, 205 345 Q210 365, 195 372 Q180 370, 170 355 Z"
          fill="#8FCB8A"/>
    <path d="M295 320 Q325 320, 340 340 Q345 365, 320 370 Q300 360, 295 345 Z"
          fill="#8FCB8A"/>

    <!-- Latitude / longitude grid -->
    <ellipse cx="256" cy="280" rx="148" ry="48" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.35"/>
    <ellipse cx="256" cy="280" rx="148" ry="100" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.25"/>
    <ellipse cx="256" cy="280" rx="55" ry="148" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

    <!-- Highlight (glossy effect) -->
    <ellipse cx="210" cy="225" rx="55" ry="22" fill="#FFFFFF" opacity="0.25"/>
  </g>

  <!-- Gold star crown floating above globe -->
  <g filter="url(#softShadow)">
    <polygon points="256,70 273,118 324,120 283,150 298,200 256,170 214,200 229,150 188,120 239,118"
             fill="url(#goldStar)" stroke="#B8860B" stroke-width="3"/>
  </g>

  <!-- Tiny flag on a pole sticking out of the globe -->
  <g filter="url(#softShadow)">
    <line x1="385" y1="170" x2="385" y2="290" stroke="#6B4423" stroke-width="6" stroke-linecap="round"/>
    <path d="M385 170 L440 178 L432 200 L440 222 L385 218 Z" fill="#EC7063" stroke="#A93226" stroke-width="2"/>
    <circle cx="412" cy="196" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="470" font-family="Arial Black, Helvetica, sans-serif" font-size="46"
        font-weight="900" text-anchor="middle" fill="#FFFFFF"
        stroke="#3A7BB5" stroke-width="2" paint-order="stroke">FLAG IQ</text>
</svg>
